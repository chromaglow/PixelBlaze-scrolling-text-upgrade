<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelblaze Text Converter</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background: #000000;
            color: #00ff00;
        }

        .card {
            background: #0a0a0a;
            padding: 2rem;
            border: 1px solid #00ff00;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            color: #00ff00;
            text-transform: uppercase;
            border-bottom: 1px solid #004400;
            padding-bottom: 0.5rem;
        }

        p {
            color: #00cc00;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            margin: 1rem 0;
            background: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 2px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #ffffff;
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }

        button {
            background: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px 24px;
            border-radius: 2px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px #00ff00;
        }

        pre {
            background: #050505;
            color: #00ff00;
            padding: 1.5rem;
            border: 1px dashed #004400;
            border-radius: 4px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 1.5rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .success {
            color: #00ff00;
            margin-top: 0.5rem;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Pixelblaze Text Converter</h1>
        <p>Type your message below to generate the code array for your Pixelblaze.</p>

        <textarea id="input" placeholder="Enter your text here...">Hello
World!</textarea>

        <div style="display: flex; gap: 10px;">
            <button onclick="convert()">Generate Code</button>
            <button onclick="copyOutput()">Copy to Clipboard</button>
        </div>
        <div id="success" class="success">Copied to clipboard!</div>

        <pre id="output">// Result will appear here...</pre>
    </div>

    <script>
        function convert() {
            const rawText = document.getElementById('input').value;
            // Split by newlines to preserve structure
            const lines = rawText.split('\n');

            let outputLines = [];

            lines.forEach(line => {
                if (line.length === 0) return; // Skip empty lines? Or keep them? Let's skip for cleanliness

                let codes = [];
                for (let i = 0; i < line.length; i++) {
                    let code = line.charCodeAt(i);
                    // ASCII range check (Pixelblaze standard font is ~32-126)
                    if (code >= 32 && code <= 126) {
                        codes.push(code);
                    } else {
                        codes.push(32); // Fallback to space
                    }
                }

                // Add newline character code (optional, but marquee usually ignores formatting. 
                // We typically just want the visual separation in the code).
                // Actually, let's just output the character codes for the visual line.
                // If the user wants a space between words on lines, they need to type it.
                // We'll treat newlines as "spaces" in the array flow? 
                // A common convention is just to append the codes.
                // We will add a space (32) at the end of a line if it's not the last line? 
                // No, let's strictly convert characters.

                if (codes.length > 0) {
                    outputLines.push(`    ${codes.join(', ')}, // ${line}`);
                }
            });

            const finalOutput = `export var message = [\n${outputLines.join('\n')}\n]`;

            document.getElementById('output').textContent = finalOutput;
        }

        function copyOutput() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.getElementById('success');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 2000);
            });
        }

        // Init
        convert();
    </script>
</body>

</html>
