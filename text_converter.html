<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelblaze Text Converter</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background: #000000;
            color: #00ff00;
        }

        .card {
            background: #0a0a0a;
            padding: 2rem;
            border: 1px solid #00ff00;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            color: #00ff00;
            text-transform: uppercase;
            border-bottom: 1px solid #004400;
            padding-bottom: 0.5rem;
        }

        p {
            color: #00cc00;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            margin: 1rem 0;
            background: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 2px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #ffffff;
            outline: none;
            box-shadow: 0 0 5px #00ff00;
        }

        button {
            background: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px 24px;
            border-radius: 2px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px #00ff00;
        }

        pre {
            background: #050505;
            color: #00ff00;
            padding: 1.5rem;
            border: 1px dashed #004400;
            border-radius: 4px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 1.5rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .success {
            color: #00ff00;
            margin-top: 0.5rem;
            display: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Pixelblaze Text Converter</h1>
        <p>Type your message below to generate the code array for your Pixelblaze.</p>

        <textarea id="input" placeholder="Enter your text here...">Hello World!</textarea>

        <button onclick="convert()">Generate Code</button>
        <div id="success" class="success">Copied to clipboard!</div>

        <pre id="output">// Result will appear here...</pre>
    </div>

    <script>
        function convert() {
            const text = document.getElementById('input').value;
            let codes = [];
            for (let i = 0; i < text.length; i++) {
                let code = text.charCodeAt(i);
                // ASCII range check (Pixelblaze standard font is ~32-126)
                if (code >= 32 && code <= 126) {
                    codes.push(code);
                } else {
                    // Fallback for unknowns (e.g. smart quotes)? Map to space (32)
                    codes.push(32);
                }
            }

            // Format output nicely
            const arrayString = `[${codes.join(', ')}]`;
            const comment = `// ${text.replace(/\n/g, ' ')}`;

            const finalOutput = `var message = ${arrayString} ${comment}`;

            document.getElementById('output').textContent = finalOutput;

            // Auto copy
            navigator.clipboard.writeText(finalOutput).then(() => {
                const msg = document.getElementById('success');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 2000);
            });
        }

        // Init
        convert();
    </script>
</body>

</html>
